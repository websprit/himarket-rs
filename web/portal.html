<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HiMarket 开发者门户</title>
  <link rel="stylesheet" href="/console.css" />
</head>
<body>
  <header>
    <strong>HiMarket 开发者门户</strong>
    <span id="who">未登录</span>
    <a href="/admin">管理后台</a>
  </header>
  <div id="login" class="card">
    <h2>开发者登录</h2>
    <input id="username" value="ugreen_voice_dev" />
    <input id="password" type="password" value="voice123" />
    <button id="login-btn">登录</button>
    <p id="login-error" class="error"></p>
  </div>
  <div id="app" hidden>
    <nav>
      <button data-panel="square" class="active">产品广场</button>
      <button data-panel="apps">我的应用</button>
      <button data-panel="voice">语音接入</button>
      <button data-panel="usage">用量</button>
    </nav>
    <section data-panel="square"><div id="products"></div></section>
    <section data-panel="apps" hidden>
      <form id="consumer-form"><input name="name" placeholder="应用名称" required /><button>创建应用</button></form>
      <div id="consumers"></div>
      <form id="key-form"><input name="consumer_id" placeholder="应用 ID" required /><button>签发 API Key</button></form>
      <p id="new-key"></p>
      <div id="keys"></div>
    </section>
    <section data-panel="voice" hidden>
      <p>Android 客户端使用业务 API Key 调用 <code>POST /api/v1/voice/sessions</code>，拿到短期 LiveKit JWT 后进入房间。文本模型走 CLIProxyAPI，语音识别和合成在 Agent 内完成。</p>
      <div id="sessions"></div>
    </section>
    <section data-panel="usage" hidden><div id="usage"></div></section>
  </div>
  <script src="/console.js"></script>
  <script>
    document.querySelectorAll("nav button").forEach((button) => button.onclick = () => { show(button.dataset.panel); load(button.dataset.panel); });
    document.getElementById("login-btn").onclick = async () => {
      try {
        const session = await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify({ role: "developer", username: username.value, password: password.value }) });
        localStorage.setItem(tokenKey, session.token);
        enter(session);
      } catch (error) { document.getElementById("login-error").textContent = error.message; }
    };
    function enter(session) {
      login.hidden = true; app.hidden = false; who.textContent = session.username + " / " + session.subject_id;
      load("square");
    }
    async function load(panel) {
      if (panel === "square") products.innerHTML = table([["名称", r => r.name], ["类型", r => r.product_type], ["说明", r => r.description || ""], ["状态", r => r.status]], await api("/api/v1/products"));
      if (panel === "apps") {
        consumers.innerHTML = table([["应用 ID", r => r.consumer_id], ["名称", r => r.name]], await api("/api/v1/consumers"));
        keys.innerHTML = table([["Key ID", r => r.api_key_id], ["应用", r => r.consumer_id], ["状态", r => r.status], ["已用微美元", r => r.quota_used_usd_micros]], await api("/api/v1/api-keys"));
      }
      if (panel === "voice") sessions.innerHTML = table([["会话", r => r.session_id], ["房间", r => r.room_name], ["模式", r => r.voice_mode], ["模型", r => r.llm_model]], await api("/api/v1/voice/sessions"));
      if (panel === "usage") usage.innerHTML = "<pre>" + JSON.stringify(await api("/api/v1/usage/summary"), null, 2) + "</pre>";
    }
    document.getElementById("consumer-form").onsubmit = async (event) => { event.preventDefault(); await api("/api/v1/consumers", { method: "POST", body: JSON.stringify({ name: event.target.name.value }) }); load("apps"); };
    document.getElementById("key-form").onsubmit = async (event) => { event.preventDefault(); const created = await api("/api/v1/api-keys", { method: "POST", body: JSON.stringify({ consumer_id: event.target.consumer_id.value }) }); document.getElementById("new-key").textContent = "新密钥只显示一次：" + created.raw_key; load("apps"); };
    if (localStorage.getItem(tokenKey)) api("/api/v1/auth/me").then(enter).catch(() => localStorage.removeItem(tokenKey));
  </script>
</body>
</html>
