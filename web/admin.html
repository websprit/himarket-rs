<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HiMarket 管理后台</title>
  <link rel="stylesheet" href="/console.css" />
</head>
<body>
  <header>
    <strong>HiMarket 管理后台</strong>
    <span id="who">未登录</span>
    <a href="/portal">开发者门户</a>
  </header>
  <div id="login" class="card">
    <h2>管理员登录</h2>
    <input id="username" value="admin" />
    <input id="password" type="password" value="admin123" />
    <button id="login-btn">登录</button>
    <p id="login-error" class="error"></p>
  </div>
  <div id="app" hidden>
    <nav>
      <button data-panel="portals" class="active">门户</button>
      <button data-panel="products">产品</button>
      <button data-panel="consumers">调用方</button>
      <button data-panel="keys">API Key</button>
      <button data-panel="sessions">语音会话</button>
      <button data-panel="models">模型配置</button>
      <button data-panel="usage">用量</button>
    </nav>
    <section data-panel="portals">
      <form id="portal-form"><input name="name" placeholder="门户名称" required /><input name="description" placeholder="说明" /><button>新建门户</button></form>
      <div id="portals"></div>
    </section>
    <section data-panel="products" hidden>
      <form id="product-form"><input name="name" placeholder="产品名称" required /><select name="product_type"><option>AGENT_API</option><option>MODEL_API</option><option>REST_API</option><option>MCP_SERVER</option><option>AGENT_SKILL</option><option>WORKER</option></select><button>发布产品</button></form>
      <div id="products"></div>
    </section>
    <section data-panel="consumers" hidden>
      <form id="consumer-form"><input name="name" placeholder="调用方名称" required /><input name="developer_id" placeholder="开发者 ID，默认 tenant_ugreen_01" /><button>新建调用方</button></form>
      <div id="consumers"></div>
    </section>
    <section data-panel="keys" hidden>
      <form id="key-form"><input name="consumer_id" placeholder="调用方 ID" required /><button>签发 API Key</button></form>
      <p id="new-key"></p>
      <div id="keys"></div>
    </section>
    <section data-panel="sessions" hidden><div id="sessions"></div></section>
    <section data-panel="models" hidden>
      <form id="lang-policy-form">
        <input name="tenant_id" placeholder="租户 ID" value="tenant_ugreen_01" required />
        <input name="default_target_lang" placeholder="默认目标语言，如 zh" value="zh" required />
        <input name="allowed_langs" placeholder="允许语言列表，逗号分隔" value="zh,en,ja,ko" required />
        <button>保存租户语言策略</button>
      </form>
      <p id="lang-policy-view"></p>
      <form id="model-form">
        <input name="tenant_id" placeholder="租户 ID" value="tenant_ugreen_01" required />
        <input name="name" placeholder="名称" required />
        <select name="kind"><option value="llm">LLM</option><option value="stt">STT</option><option value="tts">TTS</option></select>
        <select name="protocol"><option value="livekit_inference">LiveKit Inference</option><option value="livekit_realtime">LiveKit Realtime</option><option value="openai_chat">OpenAI Chat</option><option value="openai_stt">OpenAI STT</option><option value="openai_tts">OpenAI TTS</option><option value="openai_realtime">OpenAI Realtime</option><option value="google_stt">Google Chirp</option><option value="google_tts">Google Gemini TTS</option><option value="google_realtime">Google Gemini Live</option><option value="azure_tts">Azure Speech</option><option value="dashscope_stt">阿里云 ASR</option><option value="dashscope_tts">阿里云 TTS</option><option value="dashscope_realtime">阿里云 Realtime</option><option value="volcengine_stt">火山 ASR</option><option value="volcengine_tts">火山 TTS</option><option value="volcengine_realtime">火山 Realtime</option><option value="whisper_local">本地 Whisper</option><option value="piper_local">本地 Piper</option></select>
        <input name="base_url" placeholder="API 地址" />
        <input name="api_key" placeholder="API Key" />
        <input name="api_secret" placeholder="API Secret（LiveKit Inference 需要）" />
        <input name="model" placeholder="模型名" required />
        <input name="voice" placeholder="音色或本地模型路径" />
        <input name="tts_languages" placeholder="适用TTS语言，逗号分隔（可选）" />
        <input name="stt_languages" placeholder="适用STT语言，逗号分隔（可选）" />
        <label><input name="is_default" type="checkbox" /> 设为默认</label>
        <button>保存配置</button>
      </form>
      <form id="credential-form">
        <input name="config_id" placeholder="配置 ID" required />
        <input name="base_url" placeholder="覆盖 API 地址，可空" />
        <input name="api_key" placeholder="写入 API Key" />
        <input name="api_secret" placeholder="写入 API Secret" />
        <button>保存密钥</button>
      </form>
      <form id="model-lang-form">
        <input name="config_id" placeholder="配置 ID" required />
        <select name="lang_kind"><option value="tts">TTS 适用语言</option><option value="stt">STT 适用语言</option></select>
        <input name="languages" placeholder="语言标签，逗号分隔，如 zh,en,ja" />
        <button>保存模型适用语言</button>
      </form>
      <div id="models"></div>
    </section>
    <section data-panel="usage" hidden><div id="usage"></div></section>
  </div>
  <script src="/console.js"></script>
  <script>
    const splitCsv = (val) => (val || "").split(",").map(s => s.trim()).filter(Boolean);
    document.querySelectorAll("nav button").forEach((button) => button.onclick = () => { show(button.dataset.panel); load(button.dataset.panel); });
    document.getElementById("login-btn").onclick = async () => {
      try {
        const session = await api("/api/v1/auth/login", { method: "POST", body: JSON.stringify({ role: "admin", username: username.value, password: password.value }) });
        localStorage.setItem(tokenKey, session.token);
        enter(session);
      } catch (error) { document.getElementById("login-error").textContent = error.message; }
    };
    function enter(session) {
      login.hidden = true; app.hidden = false; who.textContent = session.username;
      load("portals");
    }
    async function load(panel) {
      if (panel === "portals") portals.innerHTML = table([["ID", r => r.portal_id], ["名称", r => r.name], ["说明", r => r.description || ""]], await api("/api/v1/portals"));
      if (panel === "products") products.innerHTML = table([["ID", r => r.product_id], ["名称", r => r.name], ["类型", r => r.product_type], ["状态", r => r.status]], await api("/api/v1/products"));
      if (panel === "consumers") consumers.innerHTML = table([["ID", r => r.consumer_id], ["名称", r => r.name], ["开发者", r => r.developer_id]], await api("/api/v1/consumers"));
      if (panel === "keys") keys.innerHTML = table([["Key ID", r => r.api_key_id], ["调用方", r => r.consumer_id], ["租户", r => r.tenant_id], ["已用微美元", r => r.quota_used_usd_micros]], await api("/api/v1/api-keys"));
      if (panel === "sessions") sessions.innerHTML = table([
        ["会话", r => r.session_id],
        ["房间", r => r.room_name || ""],
        ["模式", r => r.voice_mode],
        ["任务", r => r.task || "cascade"],
        ["源语言", r => r.source_lang || ""],
        ["目标语言", r => r.target_lang || ""],
        ["标题", r => r.title || ""],
        ["模型", r => r.llm_model || ""],
        ["状态", r => r.state]
      ], await api("/api/v1/voice/sessions"));
      if (panel === "models") {
        const tenant = document.querySelector("#model-form [name=tenant_id]").value || "tenant_ugreen_01";
        try {
          const policy = await api("/api/v1/tenant-language-policy?tenant_id=" + encodeURIComponent(tenant));
          document.getElementById("lang-policy-view").textContent = `当前租户(${policy.tenant_id})语言策略：默认 ${policy.default_target_lang}，允许 [${(policy.allowed_langs || []).join(", ")}]`;
        } catch (err) {
          document.getElementById("lang-policy-view").textContent = err.message;
        }
        const rows = await api("/api/v1/model-configs?tenant_id=" + encodeURIComponent(tenant));
        models.innerHTML = table([
          ["ID", r => r.config_id], ["租户", r => r.tenant_id], ["名称", r => r.name], ["类型", r => r.kind], ["协议", r => r.protocol], ["模型", r => r.model],
          ["TTS语言", r => (r.tts_languages || []).join(",")], ["STT语言", r => (r.stt_languages || []).join(",")],
          ["地址", r => r.base_url], ["密钥", r => r.api_key_hint], ["Secret", r => r.has_api_secret ? "已设置" : ""], ["默认", r => r.is_default ? "是" : ""], ["状态", r => r.status],
          ["操作", r => r.status === "ACTIVE" ? `<button data-default="${r.config_id}">默认</button> <button data-disable="${r.config_id}">停用</button>` : ""]
        ], rows);
        models.querySelectorAll("[data-default]").forEach((button) => button.onclick = async () => { await api("/api/v1/model-configs/" + button.dataset.default + "/default", { method: "POST" }); load("models"); });
        models.querySelectorAll("[data-disable]").forEach((button) => button.onclick = async () => { await api("/api/v1/model-configs/" + button.dataset.disable + "/disable", { method: "POST" }); load("models"); });
      }
      if (panel === "usage") {
        const data = await api("/api/v1/usage/summary?tenant_id=tenant_ugreen_01");
        usage.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      }
    }
    document.getElementById("portal-form").onsubmit = async (event) => { event.preventDefault(); const form = event.target; await api("/api/v1/portals", { method: "POST", body: JSON.stringify({ name: form.name.value, description: form.description.value }) }); load("portals"); };
    document.getElementById("product-form").onsubmit = async (event) => { event.preventDefault(); const form = event.target; await api("/api/v1/products", { method: "POST", body: JSON.stringify({ name: form.name.value, product_type: form.product_type.value }) }); load("products"); };
    document.getElementById("consumer-form").onsubmit = async (event) => { event.preventDefault(); const form = event.target; await api("/api/v1/consumers", { method: "POST", body: JSON.stringify({ name: form.name.value, developer_id: form.developer_id.value || "tenant_ugreen_01" }) }); load("consumers"); };
    document.getElementById("key-form").onsubmit = async (event) => { event.preventDefault(); const form = event.target; const created = await api("/api/v1/api-keys", { method: "POST", body: JSON.stringify({ consumer_id: form.consumer_id.value }) }); document.getElementById("new-key").textContent = "新密钥只显示一次：" + created.raw_key; load("keys"); };
    document.getElementById("lang-policy-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      await api("/api/v1/tenant-language-policy", {
        method: "PUT",
        body: JSON.stringify({
          tenant_id: form.tenant_id.value,
          default_target_lang: form.default_target_lang.value,
          allowed_langs: splitCsv(form.allowed_langs.value)
        })
      });
      load("models");
    };
    document.getElementById("model-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const ttsLangs = splitCsv(form.tts_languages.value);
      const sttLangs = splitCsv(form.stt_languages.value);
      await api("/api/v1/model-configs", {
        method: "POST",
        body: JSON.stringify({
          tenant_id: form.tenant_id.value,
          name: form.name.value,
          kind: form.kind.value,
          protocol: form.protocol.value,
          base_url: form.base_url.value,
          api_key: form.api_key.value,
          api_secret: form.api_secret.value,
          model: form.model.value,
          voice: form.voice.value,
          is_default: form.is_default.checked,
          tts_languages: ttsLangs.length ? ttsLangs : undefined,
          stt_languages: sttLangs.length ? sttLangs : undefined
        })
      });
      form.reset();
      load("models");
    };
    document.getElementById("credential-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      await api("/api/v1/model-configs/" + form.config_id.value + "/credentials", { method: "POST", body: JSON.stringify({ base_url: form.base_url.value, api_key: form.api_key.value, api_secret: form.api_secret.value }) });
      form.reset();
      load("models");
    };
    document.getElementById("model-lang-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const langs = splitCsv(form.languages.value);
      const kind = form.lang_kind.value;
      const path = kind === "stt" ? "/stt-languages" : "/tts-languages";
      const payload = kind === "stt" ? { stt_languages: langs } : { tts_languages: langs };
      await api("/api/v1/model-configs/" + form.config_id.value + path, { method: "POST", body: JSON.stringify(payload) });
      form.reset();
      load("models");
    };
    if (localStorage.getItem(tokenKey)) api("/api/v1/auth/me").then(enter).catch(() => localStorage.removeItem(tokenKey));
  </script>
</body>
</html>
